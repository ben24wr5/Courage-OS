name: Build Courage OS ISO

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the build computer
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt

      - name: Build courage-os.iso (Intel + Mac chips)
        run: sudo WORK=/mnt/courage-build ./build.sh

      - name: Publish the ISO on the Releases page (kept forever)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -c %s courage-os.iso)
          echo "ISO size: $((SIZE/1024/1024)) MB"
          TAG="build-${{ github.run_number }}"
          sha256sum courage-os.iso | cut -d' ' -f1 > courage-os.iso.sha256
          ls -l casper 2>/dev/null || true
          if [ "$SIZE" -ge 2000000000 ]; then
            echo "::error::ISO is $((SIZE/1000/1000)) MB - over GitHub's 2 GB single-file limit. Not splitting it."
            exit 1
          fi
          FILES="courage-os.iso courage-os.iso.sha256"
          HOW="Download **courage-os.iso**. It's the whole OS in one file, for Intel/AMD PCs, Intel Macs and Apple M-chip Macs (UTM)."
          cat > notes.md <<EOF
          $HOW

          Then flash it to your USB with balenaEtcher (or open it in UTM), connect to Wi-Fi, and type your Gemini API key on the first screen. See GUIDE.md.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" $FILES --title "Courage OS (build ${{ github.run_number }})" --notes-file notes.md --latest

      - name: Offer it as ONE full courage-os.iso (no zip, kept 90 days)
        uses: actions/upload-artifact@v7
        with:
          path: courage-os.iso
          archive: false
          retention-days: 90
