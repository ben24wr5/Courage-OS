name: Build Courage OS ISO

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the build computer
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt

      - name: Build courage-os.iso (Intel + Mac chips)
        run: sudo WORK=/mnt/courage-build ./build.sh

      - name: Publish the ISO on the Releases page (kept forever)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -c %s courage-os.iso)
          echo "ISO size: $((SIZE/1024/1024)) MB"
          TAG="build-${{ github.run_number }}"
          sha256sum courage-os.iso | cut -d' ' -f1 > courage-os.iso.sha256
          if [ "$SIZE" -lt 2000000000 ]; then
            FILES="courage-os.iso courage-os.iso.sha256"
            HOW="Download **courage-os.iso**."
          else
            split -b 1900m -d -a 1 courage-os.iso courage-os.iso.part
            FILES="$(ls courage-os.iso.part*) courage-os.iso.sha256"
            HOW="GitHub only allows files under 2 GB here, so the ISO is in pieces. Download every **courage-os.iso.part** file into your Downloads folder, then open Terminal on your Mac and paste:

          \`\`\`
          cd ~/Downloads && cat courage-os.iso.part* > courage-os.iso
          \`\`\`

          That joins them into **courage-os.iso**. (Or download it in one piece from this build's Artifacts while it lasts.)"
          fi
          cat > notes.md <<EOF
          $HOW

          Then flash it to your USB with balenaEtcher (or open it in UTM), connect to Wi-Fi, and type your Gemini API key on the first screen. See GUIDE.md.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" $FILES --title "Courage OS (build ${{ github.run_number }})" --notes-file notes.md --latest

      - name: Also offer it as one file (Artifacts, kept 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: courage-os-iso
          path: courage-os.iso
          compression-level: 0
          retention-days: 90
