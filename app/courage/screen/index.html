<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Courage OS</title>
<style>
@font-face{font-family:Dot;src:url(/screen/DotGothic16.ttf)}
:root{--screen:#3f9d92;--ink:#e9f29a;--dim:#d4ecc0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
body{font-family:Dot,monospace;color:var(--ink)}
#scr{position:fixed;inset:0;background:var(--screen);box-shadow:inset 0 0 18vmin rgba(0,40,36,.6);display:flex;flex-direction:column;padding:3vh 4vw 4vh;transition:background .8s,opacity .6s}
#scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 4px)}
#bar{display:flex;justify-content:space-between;gap:2vw;font-size:2.2vh;letter-spacing:.2em;color:var(--dim)}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;min-height:0;overflow-y:auto}
.big{font-size:3.6vh;letter-spacing:.12em;line-height:1.25;margin:0;max-width:90vw;text-wrap:balance}
.huge{font-size:8.5vh}
.body{font-size:2.8vh;letter-spacing:.1em;line-height:1.45;margin:0;max-width:80vw;white-space:pre-line}
.small{font-size:2.3vh;letter-spacing:.25em;margin:0;color:var(--dim)}
#pic{display:none;max-width:52vw;max-height:38vh;border:.5vh dashed var(--ink);border-radius:2.5vh;padding:1vh;background:rgba(0,40,36,.25);animation:pop .5s ease-out}
#pic img{display:block;max-width:100%;max-height:35vh;border-radius:1.5vh;object-fit:contain}
#pic svg{display:block;width:44vh;height:26vh}
#bars{display:flex;gap:1.2vh;align-items:center;height:7vh;opacity:.25;transition:opacity .2s}
#bars span{width:1.4vh;height:1.4vh;border-radius:1vh;background:var(--ink);transition:height .1s}
#bars.on{opacity:1}
#type{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);width:min(80vw,900px);display:none}
#type input{width:100%;font:inherit;font-size:3vh;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,40,36,.35);color:var(--ink);border:.4vh solid var(--ink);border-radius:999px;padding:1.4vh 3vh;outline:none}
#setup{display:none;flex-direction:column;gap:1vh;width:min(70vw,760px);max-height:100%}
#setup label{font-size:1.8vh;letter-spacing:.2em;text-align:left}
#setup input{font:inherit;font-size:2.2vh;letter-spacing:.06em;background:rgba(0,40,36,.35);color:var(--ink);border:.3vh solid var(--ink);border-radius:1.2vh;padding:.8vh 1.6vh;outline:none;width:100%}
#setup button{font:inherit;font-size:2.3vh;margin-top:.6vh;letter-spacing:.15em;background:var(--ink);color:#1e4d47;border:0;border-radius:999px;padding:1.4vh 4vh;cursor:pointer;align-self:center}
#err{color:#ffd0c0;min-height:2.4vh}
#pick{display:none;flex-direction:column;gap:1.2vh;width:min(70vw,800px)}
#pick button{font:inherit;font-size:3vh;letter-spacing:.1em;display:flex;justify-content:space-between;gap:2vw;text-align:left;background:rgba(0,40,36,.3);color:var(--ink);border:.4vh solid var(--ink);border-radius:999px;padding:1.2vh 3vh;cursor:pointer}
#pick button.sel,#pick button:focus{background:var(--ink);color:#1e4d47;outline:none}
@keyframes pop{from{transform:scale(.6);opacity:.2}to{transform:scale(1);opacity:1}}
.off #scr{background:#000!important;box-shadow:none}
.off #bar,.off #mid,.off #type{visibility:hidden}
.zzz{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
</style>
</head>
<body>
<div id="scr">
  <div id="bar"><span id="clk"></span><span id="stat"></span><span id="mood"></span></div>
  <div id="mid">
    <p class="small" id="said"></p>
    <p class="big" id="head">COURAGE OS</p>
    <div id="pic"></div>
    <p class="body" id="body"></p>
    <div id="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <div id="pick" role="listbox" aria-label="Pick one"></div>
    <p class="small" id="hint"></p>
    <form id="setup" autocomplete="off">
      <p class="big" style="font-size:3.4vh">FIRST, MY BRAIN.</p>
      <div id="wifi" style="display:none;flex-direction:column;gap:.8vh;border:.3vh dashed var(--ink);border-radius:1.5vh;padding:1.2vh 1.6vh">
        <p class="small" id="wmsg" style="color:var(--ink)">STEP 1: CONNECT TO WI-FI</p>
        <label for="ws">WI-FI NETWORK</label>
        <select id="ws" style="font:inherit;font-size:2.2vh;background:rgba(0,40,36,.35);color:var(--ink);border:.4vh solid var(--ink);border-radius:1.5vh;padding:1vh 2vh"></select>
        <label for="wp">WI-FI PASSWORD</label>
        <input id="wp" type="text" spellcheck="false" autocapitalize="off" style="text-transform:none">
        <button type="button" id="wj">CONNECT</button>
      </div>
      <div id="keypart" style="display:none;flex-direction:column;gap:1vh">
      <label for="k">YOUR GEMINI API KEY (STARTS WITH AIZA)</label>
      <input id="k" type="text" spellcheck="false" autocapitalize="off" style="text-transform:none">
      <label for="n">YOUR NAME</label>
      <input id="n" type="text">
      <label for="c">YOUR TOWN (FOR WEATHER)</label>
      <input id="c" type="text">
      <p class="small" id="err"></p>
      <button type="submit">WAKE UP</button>
      </div>
    </form>
  </div>
</div>
<form id="type" autocomplete="off"><input id="ti" aria-label="Type to Courage OS" placeholder="TYPE HERE, PRESS ENTER"></form>
<script>
const $=id=>document.getElementById(id);
let ws,idle=Date.now(),sleeping=false,mode='normal',ac=null;
const mid=$('mid');
function beep(f=1200,d=.015){try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(f*.55,t);o.frequency.exponentialRampToValueAtTime(f,t+.035);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.07);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.08)}catch(e){}}
let typing=0;
async function typeOut(el,text,speed=38){const id=++typing;el.textContent='';for(let i=1;i<=text.length;i++){if(id!==typing)return;el.textContent=text.slice(0,i);if(i%3===1)beep(900+Math.random()*500);await new Promise(r=>setTimeout(r,speed))}}
function clockTick(){const d=new Date();$('clk').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).toUpperCase()+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});if(!sleeping&&mode==='normal'&&Date.now()-idle>5*60e3)sleep()}
setInterval(clockTick,1000);clockTick();
function wakeScreen(){idle=Date.now();if(sleeping){sleeping=false;$('head').classList.remove('zzz','huge')}}
function sleep(){sleeping=true;$('said').textContent='';$('body').textContent='';$('pic').style.display='none';$('head').className='big huge zzz';$('head').textContent='Z Z Z . . .'}
function setPic(url,svg){const p=$('pic');p.innerHTML='';if(svg){p.innerHTML=svg;p.style.display='block'}else if(url){const i=new Image();i.alt='';i.onload=()=>{p.style.display='block'};i.onerror=()=>{p.style.display='none'};i.src=url;p.appendChild(i);p.style.display='none'}else p.style.display='none'}
function status(s){const b=s.battery==null?'':(' ● '+(s.charging?'⚡':'')+s.battery+'%');$('stat').textContent=(s.wifi?'WI-FI':'OFFLINE')+(s.bt?' ● BT':'')+b;$('mood').textContent='MOOD: '+(s.mood||'grumpy').toUpperCase();document.documentElement.style.setProperty('--screen',(s.colour&&s.colour!=='default'&&/^#[0-9a-f]{3,8}$/i.test(s.colour))?s.colour:'#3f9d92')}
function setupMode(err){$('bar').style.display='none';if(mode!=='setup')ws.send('{"t":"wifi_scan"}');mode='setup';$('setup').style.display='flex';['said','head','body','hint'].forEach(i=>$(i).style.display='none');$('pic').style.display='none';$('bars').style.display='none';$('err').textContent=err||''}
function normalMode(){mode='normal';$('bar').style.display='';$('setup').style.display='none';['said','head','body','hint'].forEach(i=>$(i).style.display='');$('bars').style.display=''}
$('wj').addEventListener('click',()=>{$('wmsg').textContent='CONNECTING...';ws.send(JSON.stringify({t:'wifi_join',ssid:$('ws').value,pw:$('wp').value}))});
$('setup').addEventListener('submit',e=>{e.preventDefault();$('err').textContent='CHECKING YOUR KEY...';ws.send(JSON.stringify({t:'setup',key:$('k').value,name:$('n').value,city:$('c').value}))});
let pickKind='',pickSel=0;
function pickShow(m){pickKind=m.kind;pickSel=0;const p=$('pick');p.innerHTML='';$('head').textContent=m.title;$('body').textContent='ARROW KEYS + ENTER, OR CLICK. ESC TO CANCEL.';setPic();
 m.items.forEach((it,i)=>{const b=document.createElement('button');b.type='button';const a=document.createElement('span');a.textContent=(i+1)+'. '+it.toUpperCase();b.appendChild(a);if(m.notes){const n=document.createElement('span');n.textContent=m.notes[i];b.appendChild(n)}b.onclick=()=>pickDo(it);b.onmouseenter=()=>pickMark(i);p.appendChild(b)});
 p.style.display='flex';document.body.style.cursor='default';mode='pick';pickMark(0)}
function pickMark(i){const bs=[...$('pick').children];if(!bs.length)return;pickSel=(i+bs.length)%bs.length;bs.forEach((b,k)=>b.classList.toggle('sel',k===pickSel));bs[pickSel].focus()}
function pickHide(){$('pick').style.display='none';document.body.style.cursor='';mode='normal'}
function pickDo(it){pickHide();ws.send(JSON.stringify({t:'picked',kind:pickKind,item:it}))}
document.addEventListener('keydown',e=>{if(mode==='pick'){const bs=[...$('pick').children];if(e.key==='ArrowDown'){pickMark(pickSel+1);e.preventDefault()}else if(e.key==='ArrowUp'){pickMark(pickSel-1);e.preventDefault()}else if(e.key==='Escape')pickHide();else if(/^[1-9]$/.test(e.key)&&bs[+e.key-1])bs[+e.key-1].click();return}});
document.addEventListener('keydown',e=>{wakeScreen();if(mode!=='normal')return;const t=$('type');if(t.style.display!=='block'&&e.key.length===1){t.style.display='block';$('ti').focus()}if(e.key==='Escape'){t.style.display='none';$('ti').value=''}});
$('type').addEventListener('submit',e=>{e.preventDefault();const v=$('ti').value.trim();if(!v)return;ws.send(JSON.stringify({t:'typed',text:v}));$('ti').value='';$('ti').style.textTransform='';$('type').style.display='none'});
const bars=[...document.querySelectorAll('#bars span')];
function on(m){
 switch(m.t){
 case 'status':status(m);break;
 case 'wake':wakeScreen();$('said').textContent='';$('body').textContent='';setPic();$('head').className='big huge';typeOut($('head'),m.head,110).then(()=>{$('head').className='big';typeOut($('body'),m.line,50)});$('hint').textContent='COURAGE OS';break;
 case 'setup':setupMode(m.error);break;
 case 'ready':normalMode();break;
 case 'wifi_list':if(m.online){$('wifi').style.display='none';$('keypart').style.display='flex';$('k').focus();break}$('keypart').style.display='none';$('wifi').style.display='flex';$('ws').innerHTML='';(m.nets.length?m.nets:['(NONE FOUND)']).forEach(n=>{const o=document.createElement('option');o.textContent=n;o.value=n;$('ws').appendChild(o)});break;
 case 'wifi_result':if(m.ok){$('wifi').style.display='none';$('keypart').style.display='flex';$('err').textContent='CONNECTED TO '+m.ssid.toUpperCase()+'. STEP 2: TYPE YOUR KEY.';$('k').focus()}else{$('wmsg').textContent='THAT DIDN\'T WORK. CHECK THE PASSWORD AND TRY AGAIN.'}break;
 case 'level':if(m.talking)wakeScreen();bars.forEach((b,i)=>b.style.height=(1.4+m.v*(i===2?6:i%2?4:2.5))+'vh');$('bars').classList.toggle('on',m.talking);break;
 case 'heard':wakeScreen();$('said').textContent='YOU SAID: "'+m.text+'"';break;
 case 'thinking':$('hint').textContent='THINKING...';break;
 case 'show':wakeScreen();$('hint').textContent='';$('head').className='big';setPic(m.pic,m.svg);typeOut($('head'),m.head,40).then(()=>typeOut($('body'),m.body,22));break;
 case 'body':$('body').textContent=m.text;break;
 case 'speaking':$('hint').textContent=m.on?'SPEAKING...':'';break;
 case 'photo':if(m.url){setPic(m.url);$('body').textContent=m.label}else setPic();break;
 case 'password':$('head').textContent='PASSWORD FOR '+m.ssid.toUpperCase()+'?';$('body').textContent='TYPE IT AND PRESS ENTER. YOU CAN SEE WHAT YOU TYPE. I WON\'T SAY IT OUT LOUD.';$('type').style.display='block';$('ti').style.textTransform='none';$('ti').focus();break;
 case 'sleep':sleep();break;
 case 'pick':wakeScreen();pickShow(m);break;
 case 'goodbye':wakeScreen();mode='bye';setPic();$('said').textContent='';typeOut($('head'),m.head,40).then(()=>typeOut($('body'),m.body,25));break;
 case 'off':document.body.classList.add('off');break;
 }}
function connect(){ws=new WebSocket('ws://'+location.host+'/ws');ws.onmessage=e=>{try{on(JSON.parse(e.data))}catch(x){}};ws.onclose=()=>setTimeout(connect,1500)}
connect();
setInterval(()=>{if(ws&&ws.readyState===1)ws.send('{"t":"status"}')},20000);
</script>
</body>
</html>
